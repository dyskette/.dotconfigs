# Lint (shellcheck) the bash that is checked in CI, the counterpart of what
# powershell.yml checks on Windows. Scoped to these files: the rest of bash/
# predates the linter and is checked when it is next touched.
name: bash

on:
  push:
    branches: [master]
    paths:
      - 'pilot/build-pilot.sh'
      - '.github/workflows/bash.yml'
  pull_request:
    paths:
      - 'pilot/build-pilot.sh'
      - '.github/workflows/bash.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          shellcheck --version
          shellcheck -S warning -x pilot/build-pilot.sh
