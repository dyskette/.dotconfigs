# which-key for tmux and psmux: prefix Space shows these keys and what they
# do, one level at a time, like nvim's which-key. Read by
# scripts/which-key.sh.
#
#   KEYS   DESCRIPTION   ACTION        (two or more spaces between fields)
#
# KEYS are the characters typed after prefix Space, in order. A DESCRIPTION
# starting with + names a group and has no ACTION: its keys are the longer
# ones that start with it. An ACTION is either
#
#   run SCRIPT   a script from tmux/scripts, run in this same popup
#   a tmux command, sent with the tmux or psmux CLI, in which
#                {s} is the session, {dir} the current pane's folder and
#                {conf} the config file
#
# Keep the commands to plain words and these placeholders: they are split
# like shell words.

s    +sessions
ss   switch or open a project          run project-picker.sh
sa   open a session in any folder      run dir-picker.sh
sd   detach                            detach-client -s ={s}

w    +windows
ww   switch window                     run window-switcher.sh
wc   new window here                   new-window -t ={s}: -c {dir}
wn   next window                       next-window -t ={s}:
wp   previous window                   previous-window -t ={s}:
w<   move window left                  swap-window -d -t -1
w>   move window right                 swap-window -d -t +1
wx   close window                      kill-window

p    +panes
p|   split right                       split-window -h -c {dir}
p-   split down                        split-window -v -c {dir}
p\   split right, full height          split-window -f -h -c {dir}
p_   split down, full width            split-window -f -v -c {dir}
ph   focus left                        select-pane -L
pj   focus down                        select-pane -D
pk   focus up                          select-pane -U
pl   focus right                       select-pane -R
pH   wider to the left                 resize-pane -L 5
pJ   taller downwards                  resize-pane -D 5
pK   taller upwards                    resize-pane -U 5
pL   wider to the right                resize-pane -R 5
pz   zoom                              resize-pane -Z
px   close pane                        kill-pane

1    yazi                              select-window -t ={s}:1
2    nvim                              select-window -t ={s}:2
3    lazygit                           select-window -t ={s}:3
4    agent                             select-window -t ={s}:4
5    shell                             select-window -t ={s}:5

[    copy mode                         copy-mode
r    reload the config                 source-file {conf}
