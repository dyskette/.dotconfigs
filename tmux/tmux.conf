source-file ~/.dotconfigs/tmux/common.conf

set-option -g default-terminal "tmux-256color"

# Closing a session's last pane moves the client to another session instead
# of detaching. psmux has no such option; the PowerShell profile's psmux
# wrapper does the same from outside.
set-option -g detach-on-destroy off

set-option -g allow-passthrough on
set-option -g extended-keys on

# Terminal features and overrides
set-option -ga terminal-features ",*:RGB" # Enable 24-bit colours
set-option -ga terminal-features ",*:strikethrough" # Enable strikethrough
set-option -ga terminal-features ",*:usstyle" # Enable underline
set-option -ga terminal-overrides ",*:Tc" # Enable True Colour
set-option -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm" # Enable undercurl support
set-option -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m" # Enable underscore colours - needs tmux-3.0

# Check if we are in WSL
if-shell 'test -n "$WSL_DISTRO_NAME"' {
  set -ga terminal-overrides ",*:Setulc=\\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m" # Enable underscore colours - needs tmux-3.0 (wsl2 in Windows Terminal)
}

# Theme follows the client: tmux 3.6+ learns it from mode 2031 notifications
# or the terminal's OSC 11 background reply, and forwards changes to panes
# (e.g. neovim) itself. @theme remembers the last one so reloading this file
# keeps it; before any report it is unset and treated as dark, like tmux does.
set-hook -g client-dark-theme 'set -g @theme dark ; source-file ~/.dotconfigs/tmux/gruvbox.conf'
set-hook -g client-light-theme 'set -g @theme light ; source-file ~/.dotconfigs/tmux/rose-pine-dawn.conf'
if-shell -F '#{==:#{@theme},light}' \
    'source-file ~/.dotconfigs/tmux/rose-pine-dawn.conf' \
    'source-file ~/.dotconfigs/tmux/gruvbox.conf'

# Hot reload of config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

bind-key s display-popup -w 80% -h 70% -E "~/.dotconfigs/tmux/scripts/session-switcher.sh"

bind-key w display-popup -w 80% -h 70% -E "~/.dotconfigs/tmux/scripts/window-switcher.sh"

bind-key S display-popup -w 80% -h 70% -E "~/.dotconfigs/tmux/scripts/new-session-from-directory.sh"

# Walk to any folder, one level at a time, and open a session there.
bind-key a display-popup -w 80% -h 70% -E "~/.dotconfigs/tmux/scripts/dir-picker.sh"

# Show directory selection on first tmux session
set-hook -g after-new-session 'display-popup -w 80% -h 70% -E "~/.dotconfigs/tmux/scripts/first-session-directory.sh"'
