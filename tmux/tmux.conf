source-file ~/.dotconfigs/tmux/common.conf

set-option -g default-terminal "tmux-256color"

# Closing a session's last pane moves the client to another session instead
# of detaching. psmux has no such option; the PowerShell profile's psmux
# wrapper does the same from outside.
set-option -g detach-on-destroy off

# Image previews in yazi (yazi-rs.github.io/docs/image-preview): its image
# protocols pass through tmux, and TERM and TERM_PROGRAM, which yazi reads to
# pick one, follow the attaching client. update-environment applies when a
# client attaches, so after changing it restart the server
# (tmux kill-server), as yazi's docs say.
set-option -g allow-passthrough on
set-option -ga update-environment TERM
set-option -ga update-environment TERM_PROGRAM

set-option -g extended-keys on

# Terminal features and overrides
set-option -ga terminal-features ",*:RGB" # Enable 24-bit colours
set-option -ga terminal-features ",*:strikethrough" # Enable strikethrough
set-option -ga terminal-features ",*:usstyle" # Enable underline
set-option -ga terminal-overrides ",*:Tc" # Enable True Colour
set-option -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm" # Enable undercurl support
set-option -ga terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m" # Enable underscore colours - needs tmux-3.0

# Check if we are in WSL
if-shell 'test -n "$WSL_DISTRO_NAME"' {
  set -ga terminal-overrides ",*:Setulc=\\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m" # Enable underscore colours - needs tmux-3.0 (wsl2 in Windows Terminal)
}

# Theme follows the client: tmux 3.6+ learns it from mode 2031 notifications
# or the terminal's OSC 11 background reply, and forwards changes to panes
# (e.g. neovim) itself. @theme remembers the last one so reloading this file
# keeps it; before any report it is unset and treated as dark, like tmux does.
set-hook -g client-dark-theme 'set -g @theme dark ; source-file ~/.dotconfigs/tmux/everforest-dark-medium.conf'
set-hook -g client-light-theme 'set -g @theme light ; source-file ~/.dotconfigs/tmux/everforest-light-medium.conf'
if-shell -F '#{==:#{@theme},light}' \
    'source-file ~/.dotconfigs/tmux/everforest-light-medium.conf' \
    'source-file ~/.dotconfigs/tmux/everforest-dark-medium.conf'

# Hot reload of config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Sessions and projects in one list: open sessions first, most recent first,
# then tmux/projects.conf, its roots and zoxide's folders.
bind-key s display-popup -T " projects " -w 80% -h 70% -E "~/.dotconfigs/tmux/scripts/project-picker.sh"

bind-key w display-popup -T " windows " -w 80% -h 70% -E "~/.dotconfigs/tmux/scripts/window-switcher.sh"

# Walk to any folder, one level at a time, and open a session there.
bind-key a display-popup -w 80% -h 70% -E "~/.dotconfigs/tmux/scripts/dir-picker.sh"

# Every session is built with the same windows, each tool already running
# (build_session, scripts/mux-lib.sh):
#
#   1 yazi   2 nvim   3 lazygit   4 agent   5 shell
#
# so the tools need no keys of their own: prefix 1..5 goes to one. Quitting
# a tool leaves its shell, so a number never moves.

# Show directory selection on first tmux session: one started from a plain
# terminal, which tmux names by number. The hook also fires for the detached
# sessions the pickers create (tm, prefix s, prefix a), and there
# display-popup has no client to draw on: it fails with "no current client"
# and takes new-session's exit status down with it, so the picker gives up
# before attaching. Hence the guard, as in psmux.conf: a client, and a
# default (numeric) session name.
set-hook -g after-new-session 'if-shell -F "#{&&:#{session_attached},#{m/r:^[0-9]+$,#{session_name}}}" "display-popup -w 80% -h 70% -E \"~/.dotconfigs/tmux/scripts/first-session-directory.sh\""'
