# vim: ft=tmux
# Everforest dark medium. Palette: sainnhe/everforest palette.md (MIT).
# Plain "set -g" lines only: psmux reads them one at a time (set-theme.ps1).
# Hex stays lowercase: tmux expands formats in styles, and an uppercase #D or
# #F is read as the pane id or window flags, which breaks the whole style.

# General: bg1 sets the bar apart from the bg0 panes
set -g status-style "fg=#d3c6aa,bg=#343f44"

# Left side: session in statusline1 green, as Everforest's lightline does
set -g status-left-length "100"
set -g status-left-style "fg=#2d353b,bg=#a7c080"
set -g status-left "#[fg=#2d353b,bg=#a7c080,bold]  | #S #[fg=#d3c6aa,bg=#343f44,nobold,nounderscore,noitalics] "

# Right side: date on bg3, host in green like the session
set -g status-right-length "100"
set -g status-right-style "fg=#d3c6aa,bg=#475258"
set -g status-right "#[fg=#d3c6aa,bg=#475258] %Y-%m-%d | %H:%M #[fg=#d3c6aa,bg=#343f44] #[fg=#2d353b,bg=#a7c080,bold] #h "

# Window status: inactive tabs in grey2 on bg2; the current one is tinted
# bg_green (Vim's DiffAdd background) with fg text in bold
set -g window-status-separator " "
set -g window-status-style "fg=#9da9a0,bg=#3d484d"
set -g window-status-format "#[fg=#9da9a0,bg=#3d484d] #I | #{?#{||:#{==:#{automatic-rename},off},#{==:#{automatic-rename},0}},#W,#{=20:pane_title}} "
set -g window-status-current-format "#[fg=#d3c6aa,bg=#425047,bold] #I | #{?#{||:#{==:#{automatic-rename},off},#{==:#{automatic-rename},0}},#W,#{=20:pane_title}} #[fg=#d3c6aa,bg=#343f44,nobold,nounderscore,noitalics]"
set -g window-status-activity-style "fg=#dbbc7f,bg=#343f44"

# Panes: bg5 borders stay visible on bg0; the active one is green
set -g pane-border-style "fg=#56635f"
set -g pane-active-border-style "fg=#a7c080"
# -q: newer tmux (seen in next-3.9) draws popups as floating panes, bordered by
# pane-active-border-style, and no longer knows this option.
set -gq popup-border-style "fg=#859289"
set -g display-panes-active-colour "#a7c080"
set -g display-panes-colour "#7fbbb3"

# Message: bg_yellow, Everforest's warning tint
set -g message-style "fg=#d3c6aa,bg=#4d4c43"

# Mode (copy-mode selection): bg_visual, the same as Vim's Visual
set -g mode-style "fg=#d3c6aa,bg=#543a48"
