# Settings shared by tmux (tmux.conf) and psmux on Windows (psmux.conf).
# Keep this file portable: no shell commands, no terminal-specific options,
# and no syntax psmux cannot parse (e.g. combined flags such as -fh).

set-option -g default-terminal "tmux-256color"

# Set the escape time to 0 for faster key repetition
set-option -g escape-time 0

# Modern tmux features
set-option -g focus-events on
set-option -g set-clipboard on

set-option -g window-status-separator ""
set-option -g renumber-windows on

# Improve window sizing behavior
set-option -g aggressive-resize on

# Windows will start from 1..n
set-option -g base-index 1
set-option -g pane-base-index 1

# Mouse support
set-option -g mouse on

# Prefix
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Pane navigation (with and without Ctrl)
bind-key h   select-pane -L
bind-key C-h select-pane -L
bind-key j   select-pane -D
bind-key C-j select-pane -D
bind-key k   select-pane -U
bind-key C-k select-pane -U
bind-key l   select-pane -R
bind-key C-l select-pane -R

# Window movement
bind-key -r "<" swap-window -d -t -1
bind-key -r ">" swap-window -d -t +1

# Pane resizing (with repeat flag)
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Pane splitting (using current path). The backslash key is single-quoted
# because psmux drops "\\", and -f is kept apart from -h/-v because psmux
# does not parse combined flags.
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key '\' split-window -f -h -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -f -v -c "#{pane_current_path}"
bind-key "%" split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

# New window in current path
bind-key "c" new-window -c "#{pane_current_path}"

# Enable vi keys.
set-option -g mode-keys vi

# Disable <prefix>-Enter to initiate copy-mode-vi
unbind-key -T copy-mode Enter

# Selection keys to be used in copy-mode-vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Key and mouse to copy selection in copy-mode-vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
