# psmux (tmux for Windows, https://github.com/psmux/psmux) entry point.
# psmux runs run-shell, if-shell and display-popup commands with pwsh, so the
# scripts here are PowerShell ports of their .sh counterparts, except the
# folder picker on <prefix> a, which is shared with tmux and runs in Git Bash.
#
# Not carried over from tmux.conf, because psmux has no equivalent:
# terminal-features/overrides and extended-keys (no terminfo), and the mode
# 2031 theme hooks. The theme is picked when the config loads and toggled
# with <prefix> T.

source-file ~/.dotconfigs/tmux/common.conf

# Not tmux-256color as on Linux: Git for Windows' terminfo has no entry for
# it, so its less (git's pager) fails with "unknown terminal type".
set-option -g default-terminal "xterm-256color"

# psmux turns the console host's Ctrl+V paste into one bracketed paste, which
# means Ctrl+V itself never reaches the pane: no visual block in nvim. Paste
# with the terminal's Ctrl+Shift+V or right click instead (or <prefix> ]).
set-option -g paste-detection off

# Initial theme: SYSTEM_COLOR_THEME (set by the PowerShell profile), falling
# back to the Windows app theme.
run-shell "~/.dotconfigs/tmux/set-theme.ps1"

# Hot reload of config
bind-key r source-file ~/.dotconfigs/tmux/psmux.conf \; display-message "Config reloaded!"

# The switchers are the same bash scripts tmux.conf uses, run by Git Bash.
bind-key s display-popup -w 80% -h 70% -E "& \"$env:ProgramFiles\Git\bin\bash.exe\" \"$HOME/.dotconfigs/tmux/scripts/session-switcher.sh\""

bind-key w display-popup -w 80% -h 70% -E "& \"$env:ProgramFiles\Git\bin\bash.exe\" \"$HOME/.dotconfigs/tmux/scripts/window-switcher.sh\""

bind-key S display-popup -w 80% -h 70% -E "~/.dotconfigs/tmux/scripts/new-session-from-directory.ps1"

# Walk to any folder, one level at a time, and open a session there. The
# picker is the same bash script tmux.conf uses, run by Git Bash: each step
# starts a process, and Git Bash starts several times faster than pwsh.
bind-key a display-popup -w 80% -h 70% -E "& \"$env:ProgramFiles\Git\bin\bash.exe\" \"$HOME/.dotconfigs/tmux/scripts/dir-picker.sh\""

# Show directory selection on first psmux session. Unlike tmux.conf this hangs
# off client-attached: psmux 3.3.8 never fires after-new-session for the
# session a client starts. A display-popup run directly by the hook draws
# nothing either, so the hook asks the server for it through the psmux CLI,
# which by then reaches the attached client.
# psmux runs one server per session, so switch-client is an attach to the
# target's server and fires this hook too, while the switcher's popup is still
# closing: the popup then fails with "The handle is invalid". Hence the guard:
# only a default (numeric) session name, and only once per server (@asked).
set-hook -g client-attached 'if-shell -F "#{&&:#{m/r:^[0-9]+$,#{session_name}},#{?@asked,0,1}}" "set-option -g @asked 1 ; run-shell -b \"psmux display-popup -w 80% -h 70% -E ~/.dotconfigs/tmux/scripts/first-session-directory.ps1\""'

bind-key T run-shell "~/.dotconfigs/tmux/toggle-theme.ps1"
