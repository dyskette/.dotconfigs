# psmux (tmux for Windows, https://github.com/psmux/psmux) entry point. The
# sessions work as tmux.conf's do, through the same bash scripts
# (tmux/scripts, run by Git Bash); psmux runs run-shell, if-shell and
# display-popup commands with pwsh, which starts them.
#
# Not carried over from tmux.conf, because psmux has no equivalent:
# terminal-features/overrides and extended-keys (no terminfo), and the mode
# 2031 theme hooks. The theme is picked when the config loads and toggled
# with <prefix> T.

source-file ~/.dotconfigs/tmux/common.conf

# Not tmux-256color as on Linux: Git for Windows' terminfo has no entry for
# it, so its less (git's pager) fails with "unknown terminal type".
set-option -g default-terminal "xterm-256color"

# psmux turns the console host's Ctrl+V paste into one bracketed paste, which
# means Ctrl+V itself never reaches the pane: no visual block in nvim. Paste
# with the terminal's Ctrl+Shift+V or right click instead (or <prefix> ]).
set-option -g paste-detection off

# yazi's image-preview settings, as in tmux.conf. psmux 3.4.0 accepts
# allow-passthrough but does nothing with it yet (no passthrough or image
# protocol handling in its source), so images do not show through psmux;
# the line is here for when it does. update-environment works, but -a does
# not append to it (the list stays as it was), so the whole list is given:
# psmux's default plus TERM and TERM_PROGRAM.
set-option -g allow-passthrough on
set-option -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY TERM TERM_PROGRAM"

# Initial theme: SYSTEM_COLOR_THEME (set by the PowerShell profile), falling
# back to the Windows app theme.
run-shell "~/.dotconfigs/tmux/set-theme.ps1"

# Hot reload of config
bind-key r source-file ~/.dotconfigs/tmux/psmux.conf \; display-message "Config reloaded!"

# Popups. psmux 3.4.0 starts every popup command as pwsh -NoProfile -Command
# <cmd> (~400 ms before anything shows). With windows/pwsh-shim on PATH (the
# PowerShell profile puts it first), a command that is a plain program call,
# & 'program' args, starts that program directly instead (~2 ms), and
# anything else still reaches the real pwsh. So these popups are written as
# plain calls, and the pickers start fzf itself: it opens at once and fills
# itself through its callbacks, which reach the bash scripts (the same ones
# tmux.conf uses) through cmd and scripts/pick.cmd. Enter is fzf's become:
# the script that opens the pick replaces fzf in the popup.
#
# psmux 3.4.0 reads only -w, -h, -d/-c, -E and -K of display-popup; anything
# else (a -T title, as tmux.conf has) ends up in the command. fzf's
# --delimiter is a regex, so '\t' is a tab; values with commas are quoted,
# since the shim hands a bare comma to pwsh.
#
# Sessions and projects in one list: open sessions first, most recent first,
# then tmux/projects.conf, its roots and zoxide's folders.
bind-key s display-popup -w 80% -h 70% -E "& 'fzf' \
    --with-shell 'cmd.exe /d /c' \
    --bind 'start:reload:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd project-picker list' \
    --bind 'ctrl-x:transform:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd project-picker kill {n}' \
    --bind 'focus:change-prompt:project ❯ ' \
    --bind 'enter:become:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd project-picker open {n}' \
    --ansi --reverse --border none --info inline-right \
    --delimiter '\t' --with-nth 3 --tiebreak index \
    --header '● open, recent first · ★ project · ▸ root · z zoxide · ctrl-x twice: kill' \
    --prompt 'project ❯ ' \
    --preview '%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd project-picker preview {n}' \
    --preview-window 'right:50%:border-left'"

bind-key w display-popup -w 80% -h 70% -E "& 'fzf' \
    --with-shell 'cmd.exe /d /c' \
    --bind 'start:reload:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd window-switcher list' \
    --bind 'ctrl-x:transform:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd window-switcher kill {n}' \
    --bind 'focus:change-prompt:window ❯ ' \
    --bind 'enter:become:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd window-switcher open {n}' \
    --ansi --reverse --border none --info inline-right \
    --delimiter '\t' --with-nth 2 \
    --header 'enter switch · ctrl-x twice: close' \
    --prompt 'window ❯ ' \
    --preview '%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd window-switcher preview {n}' \
    --preview-window 'right:60%:border-left'"

# which-key: the keys of which-key.conf, a level at a time (replaces
# next-layout on Space). The same bash script tmux.conf uses.
bind-key Space display-popup -w 80% -h 70% -E "& \"$env:ProgramFiles\Git\usr\bin\bash.exe\" \"$HOME/.dotconfigs/tmux/scripts/which-key.sh\""

# Walk to any folder, one level at a time, and open a session there.
bind-key a display-popup -w 80% -h 70% -E "& 'fzf' \
    --with-shell 'cmd.exe /d /c' \
    --bind 'start:transform:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd dir-picker start' \
    --bind 'tab:transform:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd dir-picker descend tab {n}' \
    --bind '/:transform:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd dir-picker descend sep {n}' \
    --bind '\:transform:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd dir-picker descend sep {n}' \
    --bind 'backward-eof:transform:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd dir-picker up' \
    --bind 'enter:become:%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd dir-picker open {n}' \
    --delimiter '\t' --with-nth '2,3' --nth 1 \
    --tiebreak 'begin,length,index' \
    --reverse --border none --info inline-right \
    --preview '%USERPROFILE%\.dotconfigs\tmux\scripts\pick.cmd dir-picker preview {n}' \
    --preview-window 'right:50%:border-left'"

# The slots, as in tmux.conf: every session is built with each tool already
# running (build_session, mux-lib.sh):
#
#   1 yazi   2 nvim   3 lazygit   4 agent   5 shell
#
# so prefix 1..5 is plain select-window.

# Show directory selection on first psmux session. Unlike tmux.conf this hangs
# off client-attached: psmux 3.3.8 never fires after-new-session for the
# session a client starts. A display-popup run directly by the hook draws
# nothing either, so the hook asks the server for it through the psmux CLI,
# which by then reaches the attached client.
# psmux runs one server per session, so switch-client is an attach to the
# target's server and fires this hook too, while the switcher's popup is still
# closing: the popup then fails with "The handle is invalid". Hence the guard:
# only a default (numeric) session name, and only once per server (@asked).
set-hook -g client-attached 'if-shell -F "#{&&:#{m/r:^[0-9]+$,#{session_name}},#{?@asked,0,1}}" "set-option -g @asked 1 ; run-shell -b \"psmux display-popup -w 80% -h 70% -E ~/.dotconfigs/tmux/scripts/first-session-directory.ps1\""'

bind-key T run-shell "~/.dotconfigs/tmux/toggle-theme.ps1"
