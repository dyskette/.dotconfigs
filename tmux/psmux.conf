# psmux (tmux for Windows, https://github.com/psmux/psmux) entry point. The
# sessions work as tmux.conf's do, through the same bash scripts
# (tmux/scripts, run by Git Bash); psmux runs run-shell, if-shell and
# display-popup commands with pwsh, which starts them.
#
# Not carried over from tmux.conf, because psmux has no equivalent:
# terminal-features/overrides and extended-keys (no terminfo), and the mode
# 2031 theme hooks. The theme is picked when the config loads and toggled
# with <prefix> T.

source-file ~/.dotconfigs/tmux/common.conf

# Not tmux-256color as on Linux: Git for Windows' terminfo has no entry for
# it, so its less (git's pager) fails with "unknown terminal type".
set-option -g default-terminal "xterm-256color"

# psmux turns the console host's Ctrl+V paste into one bracketed paste, which
# means Ctrl+V itself never reaches the pane: no visual block in nvim. Paste
# with the terminal's Ctrl+Shift+V or right click instead (or <prefix> ]).
set-option -g paste-detection off

# yazi's image-preview settings, as in tmux.conf. psmux 3.4.0 accepts
# allow-passthrough but does nothing with it yet (no passthrough or image
# protocol handling in its source), so images do not show through psmux;
# the line is here for when it does. update-environment works, but -a does
# not append to it (the list stays as it was), so the whole list is given:
# psmux's default plus TERM and TERM_PROGRAM.
set-option -g allow-passthrough on
set-option -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY TERM TERM_PROGRAM"

# Initial theme: SYSTEM_COLOR_THEME (set by the PowerShell profile), falling
# back to the Windows app theme.
run-shell "~/.dotconfigs/tmux/set-theme.ps1"

# Hot reload of config
bind-key r source-file ~/.dotconfigs/tmux/psmux.conf \; display-message "Config reloaded!"

# The pickers are the same bash scripts tmux.conf uses, run by Git Bash.
# usr\bin\bash.exe is bash itself; bin\bash.exe is a launcher that only sets
# MSYSTEM and starts it, costing a process (~20 ms) before fzf can draw.
# psmux 3.4.0 runs every popup command through pwsh -NoProfile (~370 ms).
# Newer builds run `display-popup -- prog args` directly, without a shell, as
# long as the words hold no $ or %; switch these lines to that form (with
# literal paths) once a release has it. The same goes for popup titles: 3.4.0
# reads only -w, -h, -d/-c, -E and -K, and anything else (-T " projects ",
# as tmux.conf has) ends up in the command, so the popup runs nothing.
#
# Sessions and projects in one list: open sessions first, most recent first,
# then tmux/projects.conf, its roots and zoxide's folders.
bind-key s display-popup -w 80% -h 70% -E "& \"$env:ProgramFiles\Git\usr\bin\bash.exe\" \"$HOME/.dotconfigs/tmux/scripts/project-picker.sh\""

bind-key w display-popup -w 80% -h 70% -E "& \"$env:ProgramFiles\Git\usr\bin\bash.exe\" \"$HOME/.dotconfigs/tmux/scripts/window-switcher.sh\""

# Walk to any folder, one level at a time, and open a session there. The
# picker is the same bash script tmux.conf uses, run by Git Bash: each step
# starts a process, and Git Bash starts several times faster than pwsh.
bind-key a display-popup -w 80% -h 70% -E "& \"$env:ProgramFiles\Git\usr\bin\bash.exe\" \"$HOME/.dotconfigs/tmux/scripts/dir-picker.sh\""

# The slots, as in tmux.conf: every session is built with
#
#   1 yazi   2 nvim   3 lazygit   4 agent   5 shell
#
# and a tool is typed into its window the first time the window is shown.
# tmux.conf does that from a hook through a script; psmux 3.4.0 cannot spawn
# one from a hook or a key once programs run in the session ("The handle is
# invalid"), so here prefix 1..4 does it without spawning anything: if the
# window still waits (@slot_N, set by build_session in mux-lib.sh), send-keys
# types the command and the option is cleared. send-keys expands no formats
# in psmux 3.4.0, so the commands are constants, the same as mux-lib.sh's
# slot_command; the editor's pipe is named from the pane's own
# PSMUX_TARGET_SESSION, as editor_address names it. A window reached
# another way (the mouse, prefix n/p, the window switcher) starts on its key.
bind-key 1 select-window -t :1 \; if-shell -F "#{@slot_1}" "send-keys -t :1 'yazi' Enter \; set-option -u @slot_1"
bind-key 2 select-window -t :2 \; if-shell -F "#{@slot_2}" "send-keys -t :2 'nvim --listen //./pipe/nvim-$env:PSMUX_TARGET_SESSION' Enter \; set-option -u @slot_2"
bind-key 3 select-window -t :3 \; if-shell -F "#{@slot_3}" "send-keys -t :3 'lazygit' Enter \; set-option -u @slot_3"
bind-key 4 select-window -t :4 \; if-shell -F "#{@slot_4}" "send-keys -t :4 'opencode' Enter \; set-option -u @slot_4"

# Show directory selection on first psmux session. Unlike tmux.conf this hangs
# off client-attached: psmux 3.3.8 never fires after-new-session for the
# session a client starts. A display-popup run directly by the hook draws
# nothing either, so the hook asks the server for it through the psmux CLI,
# which by then reaches the attached client.
# psmux runs one server per session, so switch-client is an attach to the
# target's server and fires this hook too, while the switcher's popup is still
# closing: the popup then fails with "The handle is invalid". Hence the guard:
# only a default (numeric) session name, and only once per server (@asked).
set-hook -g client-attached 'if-shell -F "#{&&:#{m/r:^[0-9]+$,#{session_name}},#{?@asked,0,1}}" "set-option -g @asked 1 ; run-shell -b \"psmux display-popup -w 80% -h 70% -E ~/.dotconfigs/tmux/scripts/first-session-directory.ps1\""'

bind-key T run-shell "~/.dotconfigs/tmux/toggle-theme.ps1"
