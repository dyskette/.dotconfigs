# Folders for the project picker (prefix s, tm), read by
# tmux/scripts/project-picker.sh on tmux and psmux alike.
#
#   project  PATH  [NAME]       this folder, as session NAME (default: its name)
#   root     PATH  [depth=N]    the folders inside PATH, N levels down (default 1)
#
# PATH may start with ~ and takes / or \ on either platform; it has no spaces.
# Paths that do not exist are skipped, which is how one file serves both
# machines: ~/Projects is only on Windows, ~/Proyectos only on Linux.
# After these, the picker lists zoxide's 30 most frecent folders.

project  ~/.dotconfigs     dotconfigs

root     ~/Projects
root     ~/source/repos
root     ~/Proyectos
