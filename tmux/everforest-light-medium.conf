# vim: ft=tmux
# Everforest light medium. Palette: sainnhe/everforest palette.md (MIT).
# Plain "set -g" lines only: psmux reads them one at a time (set-theme.ps1).
# Hex stays lowercase: tmux expands formats in styles, and an uppercase #D or
# #F is read as the pane id or window flags, which breaks the whole style.
# Light greens are too pale for text on them (bg0 on statusline1 is 2.2:1), so
# the session and host blocks are inverted fg instead (5.2:1).

# General: bg1 sets the bar apart from the bg0 panes
set -g status-style "fg=#5c6a72,bg=#f4f0d9"

# Left side
set -g status-left-length "100"
set -g status-left-style "fg=#fdf6e3,bg=#5c6a72"
set -g status-left "#[fg=#fdf6e3,bg=#5c6a72,bold]  | #S #[fg=#5c6a72,bg=#f4f0d9,nobold,nounderscore,noitalics] "

# Right side: date on bg3, host inverted like the session
set -g status-right-length "100"
set -g status-right-style "fg=#5c6a72,bg=#e6e2cc"
set -g status-right "#[fg=#5c6a72,bg=#e6e2cc] %Y-%m-%d | %H:%M #[fg=#5c6a72,bg=#f4f0d9] #[fg=#fdf6e3,bg=#5c6a72,bold] #h "

# Window status: inactive tabs on bg2 (grey text would be 2.8:1, so fg); the
# current one is tinted bg_green with fg text in bold
set -g window-status-separator " "
set -g window-status-style "fg=#5c6a72,bg=#efebd4"
set -g window-status-format "#[fg=#5c6a72,bg=#efebd4] #I | #{?#{||:#{==:#{automatic-rename},off},#{==:#{automatic-rename},0}},#W,#{=20:pane_title}} "
set -g window-status-current-format "#[fg=#5c6a72,bg=#f0f1d2,bold] #I | #{?#{||:#{==:#{automatic-rename},off},#{==:#{automatic-rename},0}},#W,#{=20:pane_title}} #[fg=#5c6a72,bg=#f4f0d9,nobold,nounderscore,noitalics]"
set -g window-status-activity-style "fg=#f57d26,bg=#f4f0d9"

# Panes: bg5 borders stay visible on bg0; the active one is green
set -g pane-border-style "fg=#bdc3af"
set -g pane-active-border-style "fg=#8da101"
# -q: newer tmux (seen in next-3.9) draws popups as floating panes, bordered by
# pane-active-border-style, and no longer knows this option.
set -gq popup-border-style "fg=#939f91"
set -g display-panes-active-colour "#8da101"
set -g display-panes-colour "#3a94c5"

# Message: bg_yellow, Everforest's warning tint
set -g message-style "fg=#5c6a72,bg=#faedcd"

# Mode (copy-mode selection): bg_visual, the same as Vim's Visual
set -g mode-style "fg=#5c6a72,bg=#eaedc8"
