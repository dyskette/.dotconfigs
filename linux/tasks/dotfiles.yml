- name: Dotfiles | Set common facts
  ansible.builtin.set_fact:
    repository_dir: "{{ playbook_dir | dirname }}"
    config_dir: "{{ ansible_env.HOME }}/.config"
  tags: dotfiles

- name: Dotfiles | Ensure .config directory exists in the user's home
  ansible.builtin.file:
    path: "{{ config_dir }}"
    state: directory
    mode: "0755"
  tags: dotfiles

- name: Dotfiles | Ensure Claude Code directory exists in the user's home
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.claude"
    state: directory
    mode: "0700"
  tags: dotfiles

- name: Dotfiles | Create vs code directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
  loop:
    - { path: "{{ ansible_env.HOME }}/.config/Code/User/" }
    - { path: "{{ ansible_env.HOME }}/.var/app/com.visualstudio.code/config/Code/User" }

- name: Dotfiles | Create zed directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
  loop:
    - { path: "{{ ansible_env.HOME }}/.config/zed/" }

- name: Dotfiles | Create lazygit directory
  ansible.builtin.file:
    path: "{{ config_dir }}/lazygit"
    state: directory

- name: Dotfiles | Create symbolic links
  ansible.builtin.file:
    src: "{{ repository_dir }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "nvim", dest: "{{ config_dir }}/nvim" }
    - { src: "bash/bashrc", dest: "{{ ansible_env.HOME }}/.bashrc" }
    - { src: "bash/bashrc.d", dest: "{{ ansible_env.HOME }}/.bashrc.d" }
    - { src: "bat", dest: "{{ config_dir }}/bat" }
    - { src: "lazygit/config.yml", dest: "{{ config_dir }}/lazygit/config.yml" }
    - { src: "claude/settings.json", dest: "{{ ansible_env.HOME }}/.claude/settings.json" }
    - { src: "ghostty", dest: "{{ config_dir }}/ghostty" }
    - { src: "jetbrains/ideavimrc", dest: "{{ ansible_env.HOME }}/.ideavimrc" }
    - { src: "tmux", dest: "{{ config_dir }}/tmux" }
    - { src: "vscode/settings.json", dest: "{{ ansible_env.HOME }}/.config/Code/User/settings.json" }
    - { src: "vscode/keybindings.json", dest: "{{ ansible_env.HOME }}/.config/Code/User/keybindings.json" }
    - { src: "vscode/settings.json", dest: "{{ ansible_env.HOME }}/.var/app/com.visualstudio.code/config/Code/User/settings.json" }
    - { src: "vscode/keybindings.json", dest: "{{ ansible_env.HOME }}/.var/app/com.visualstudio.code/config/Code/User/keybindings.json" }
    - { src: "zed/keymap.json", dest: "{{ config_dir }}/zed/keymap.json" }
    - { src: "zed/settings.json", dest: "{{ config_dir }}/zed/settings.json" }
    - { src: "zellij", dest: "{{ config_dir }}/zellij" }
    - { src: "yazi", dest: "{{ config_dir }}/yazi" }
    - { src: "opencode", dest: "{{ config_dir }}/opencode" }
  tags: dotfiles

# The lazygit pager is delta, which reads its settings from git config.
- name: Dotfiles | Include delta settings in the global git config
  community.general.git_config:
    name: include.path
    value: "{{ repository_dir }}/git/delta.gitconfig"
    add_mode: add
    scope: global
  tags: dotfiles

- name: Dotfiles | Install yazi packages
  ansible.builtin.command:
    cmd: $HOME/.local/bin/ya pkg install
  tags: dotfiles

- name: Dotfiles | Run bat cache
  ansible.builtin.command:
    cmd: $HOME/.local/opt/bat/bat cache --build
  tags: dotfiles
