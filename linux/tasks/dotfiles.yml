- name: Dotfiles | Set common facts
  ansible.builtin.set_fact:
    repository_dir: "{{ playbook_dir | dirname }}"
    config_dir: "{{ ansible_facts['env']['HOME'] }}/.config"
  tags: dotfiles

- name: Dotfiles | Ensure .config directory exists in the user's home
  ansible.builtin.file:
    path: "{{ config_dir }}"
    state: directory
    mode: "0755"
  tags: dotfiles

- name: Dotfiles | Ensure Claude Code directory exists in the user's home
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude"
    state: directory
    mode: "0700"
  tags: dotfiles

- name: Dotfiles | Create vs code directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
  loop:
    - { path: "{{ ansible_facts['env']['HOME'] }}/.config/Code/User/" }
    - { path: "{{ ansible_facts['env']['HOME'] }}/.var/app/com.visualstudio.code/config/Code/User" }

- name: Dotfiles | Create zed directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
  loop:
    - { path: "{{ ansible_facts['env']['HOME'] }}/.config/zed/" }

- name: Dotfiles | Create lazygit directory
  ansible.builtin.file:
    path: "{{ config_dir }}/lazygit"
    state: directory

# Zellij's config folder is built from both halves of the repository: the
# Linux config.kdl and service layout (they name bash, zja and zjr, and KDL
# has neither includes nor variables), and the shared themes, lobby layout and
# plugin. Older setups linked the whole zellij/ folder, which would make the
# links below land inside the repository.
- name: Dotfiles | Look at the Zellij config folder
  ansible.builtin.stat:
    path: "{{ config_dir }}/zellij"
    follow: false
  register: zellij_config
  tags: dotfiles

- name: Dotfiles | Drop the old whole-folder Zellij link
  when: zellij_config.stat.islnk | default(false)
  ansible.builtin.file:
    path: "{{ config_dir }}/zellij"
    state: absent
  tags: dotfiles

- name: Dotfiles | Create the Zellij config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ config_dir }}/zellij"
    - "{{ config_dir }}/zellij/layouts"
  tags: dotfiles

- name: Dotfiles | Create symbolic links
  ansible.builtin.file:
    src: "{{ repository_dir }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "nvim", dest: "{{ config_dir }}/nvim" }
    - { src: "bash/bashrc", dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc" }
    - { src: "bash/bashrc.d", dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d" }
    - { src: "bat", dest: "{{ config_dir }}/bat" }
    - { src: "delta", dest: "{{ config_dir }}/delta" }
    - { src: "fd", dest: "{{ config_dir }}/fd" }
    - { src: "lazygit/config.yml", dest: "{{ config_dir }}/lazygit/config.yml" }
    - { src: "claude/settings.json", dest: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json" }
    - { src: "ghostty", dest: "{{ config_dir }}/ghostty" }
    - { src: "jetbrains/ideavimrc", dest: "{{ ansible_facts['env']['HOME'] }}/.ideavimrc" }
    - { src: "tmux", dest: "{{ config_dir }}/tmux" }
    - { src: "vscode/settings.json", dest: "{{ ansible_facts['env']['HOME'] }}/.config/Code/User/settings.json" }
    - { src: "vscode/keybindings.json", dest: "{{ ansible_facts['env']['HOME'] }}/.config/Code/User/keybindings.json" }
    - { src: "vscode/settings.json", dest: "{{ ansible_facts['env']['HOME'] }}/.var/app/com.visualstudio.code/config/Code/User/settings.json" }
    - { src: "vscode/keybindings.json", dest: "{{ ansible_facts['env']['HOME'] }}/.var/app/com.visualstudio.code/config/Code/User/keybindings.json" }
    - { src: "zed/keymap.json", dest: "{{ config_dir }}/zed/keymap.json" }
    - { src: "zed/settings.json", dest: "{{ config_dir }}/zed/settings.json" }
    - { src: "zellij/linux/config.kdl", dest: "{{ config_dir }}/zellij/config.kdl" }
    - { src: "zellij/linux/layouts/service.kdl", dest: "{{ config_dir }}/zellij/layouts/service.kdl" }
    - { src: "zellij/layouts/lobby.kdl", dest: "{{ config_dir }}/zellij/layouts/lobby.kdl" }
    - { src: "zellij/themes", dest: "{{ config_dir }}/zellij/themes" }
    - { src: "zellij/plugins", dest: "{{ config_dir }}/zellij/plugins" }
    - { src: "yazi", dest: "{{ config_dir }}/yazi" }
    - { src: "opencode", dest: "{{ config_dir }}/opencode" }
  tags: dotfiles

# zj, zja, zjr and zj-hub-projects are what the Zellij config, the service
# layout and the hub run; ~/.local/bin is on PATH for every shell and for the
# Zellij server.
- name: Dotfiles | Link the Zellij workspace commands
  ansible.builtin.file:
    src: "{{ repository_dir }}/zellij/bin/{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - zj
    - zja
    - zjr
    - zj-hub-projects
  tags: dotfiles

# The pilot plugin is built, not committed. Without cargo (Fedora Silverblue
# keeps no toolchain) the workspace still works, minus Alt+hjkl, the agent key
# and the hub, so this reports instead of failing.
- name: Dotfiles | Look for cargo
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/cargo"
  register: cargo_binary
  tags: dotfiles

- name: Dotfiles | Build the Zellij pilot plugin
  when: cargo_binary.stat.exists
  ansible.builtin.command:
    cmd: "{{ repository_dir }}/zellij/plugins/build-pilot.sh"
  environment:
    PATH: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin:{{ ansible_facts['env']['PATH'] }}"
  changed_when: false
  tags: dotfiles

- name: Dotfiles | Report a missing Rust toolchain
  when: not cargo_binary.stat.exists
  ansible.builtin.debug:
    msg: >-
      cargo was not found, so zellij/plugins/pilot.wasm was not built.
      Install Rust with rustup and run zellij/plugins/build-pilot.sh.
  tags: dotfiles

# delta reads its settings from git config. --replace-all with a value pattern
# rewrites only this include, so re-running neither duplicates it nor touches
# other includes.
- name: Dotfiles | Include delta's Everforest features in the global git config
  ansible.builtin.command:
    argv: [git, config, --global, --replace-all, include.path, "~/.config/delta/everforest.gitconfig", "delta/everforest"]
  changed_when: false
  tags: dotfiles

- name: Dotfiles | Install yazi packages
  ansible.builtin.command:
    cmd: $HOME/.local/bin/ya pkg install
  tags: dotfiles

- name: Dotfiles | Run bat cache
  ansible.builtin.command:
    cmd: $HOME/.local/opt/bat/bat cache --build
  tags: dotfiles
