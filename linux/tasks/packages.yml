---
- name: CLI packages
  tags: cli,dependencies
  block:
  - name: Ubuntu
    become: true
    when: is_ubuntu
    block:
      - name: Ubuntu | Upgrade the current system
        ansible.builtin.apt:
          update_cache: true
          upgrade: true

      - name: Ubuntu | Add git-core PPA repository for the latest git
        ansible.builtin.apt_repository:
          repo: ppa:git-core/ppa
          state: present

      - name: Ubuntu | Update cache
        ansible.builtin.apt:
          update_cache: true

      - name: Ubuntu | Install packages
        ansible.builtin.apt:
          state: present
          pkg:
            - git
            - unzip
            - xz-utils
            - make
            - gcc
            - python3-venv
            - wl-clipboard
            - dbus-bin
            - libglib2.0-bin
            - ffmpeg
            - 7zip
            - poppler-utils
            - imagemagick
            - tmux
            - libgtk-4-1
            - socat

  - name: Fedora Silverblue
    when: is_fedora_silverblue
    block:
      - name: Fedora Silverblue | Remove defunct pgdev/ghostty copr repository
        become: true
        ansible.builtin.file:
          path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:pgdev:ghostty.repo
          state: absent

      - name: Fedora Silverblue | Enable scottames/ghostty copr repository
        become: true
        ansible.builtin.get_url:
          url: "https://copr.fedorainfracloud.org/coprs/scottames/ghostty/repo/fedora-{{ ansible_facts['distribution_major_version'] }}/scottames-ghostty-fedora-{{ ansible_facts['distribution_major_version'] }}.repo"
          dest: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:scottames:ghostty.repo
          mode: "0644"

      - name: Fedora Silverblue | Install rpm-ostree packages
        community.general.rpm_ostree_pkg:
          state: present
          name:
            - git
            - gcc
            - glib2-devel
            - tmux
            - wl-clipboard
            - p7zip
            - p7zip-plugins
            - xz
            - ghostty

      - name: Fedora Silverblue | Add flathub repository
        community.general.flatpak_remote:
          name: flathub
          state: present
          flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
          method: system

      - name: Fedora Silverblue | Install flatpak packages
        community.general.flatpak:
          method: system
          state: present
          name:
            - com.visualstudio.code

      - name: VS Code extensions
        tags: vscode-extensions
        block:
          - name: VS Code extensions | Set common facts
            ansible.builtin.set_fact:
              extensions_file: "{{ playbook_dir | dirname }}/vscode/extensions.json"

          - name: VS Code extensions | Load extensions.json
            ansible.builtin.set_fact:
              extensions: "{{ lookup('file', extensions_file) | from_json }}"

          - name: VS Code extensions | Install
            ansible.builtin.command: "flatpak run com.visualstudio.code --install-extension {{ item }}"
            loop: "{{ extensions.extensions + extensions.linux }}"
            register: extension_install_results
            ignore_errors: true  # Continue if one extension fails
            changed_when: "'already installed' not in extension_install_results.stderr"

  - name: Fedora
    become: true
    when: is_fedora
    block:
      - name: Fedora | Install packages
        ansible.builtin.dnf:
          state: present
          name:
            - git
            - gcc
            - glib2-devel
            - tmux
            - wl-clipboard
            - p7zip
            - p7zip-plugins
            - xz
            - dbus-tools
            - gtk4
            - socat
