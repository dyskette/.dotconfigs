---
- name: SQL*Plus | Check if SQL*Plus is already installed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.local/bin/sqlplus"
  register: sqlplus_installed

- name: SQL*Plus | Show installation status
  ansible.builtin.debug:
    msg: "SQL*Plus {{ 'is already installed' if sqlplus_installed.stat.exists else 'will be installed' }}"

- name: SQL*Plus | Installation block
  when: not sqlplus_installed.stat.exists
  block:
    - name: SQL*Plus | Install unzip package (Debian/Ubuntu)
      ansible.builtin.package:
        name: unzip
        state: present
      become: true
      when: is_ubuntu

    - name: SQL*Plus | Install unzip package (Fedora)
      ansible.builtin.package:
        name: unzip
        state: present
      become: true
      when: is_fedora or is_fedora_silverblue

    - name: SQL*Plus | Install libaio package (Debian/Ubuntu)
      ansible.builtin.package:
        # Ubuntu 24.04 renamed libaio1 to libaio1t64 in the 64-bit time_t transition
        name: "{{ 'libaio1t64' if ansible_facts['distribution_major_version'] | int >= 24 else 'libaio1' }}"
        state: present
      become: true
      when: is_ubuntu

    - name: SQL*Plus | Install libaio package (Fedora)
      ansible.builtin.package:
        name: libaio
        state: present
      become: true
      when: is_fedora or is_fedora_silverblue

    # Ubuntu 24.04's libaio1t64 bumped the soname to libaio.so.1t64, but Oracle's
    # prebuilt binaries still link against libaio.so.1. On amd64 the t64 rebuild is
    # ABI-identical (time_t was already 64-bit there), so a compat symlink is safe.
    - name: SQL*Plus | Link libaio.so.1 to the t64 build (Debian/Ubuntu)
      ansible.builtin.file:
        src: "/usr/lib/{{ ansible_facts['architecture'] }}-linux-gnu/libaio.so.1t64"
        dest: "/usr/lib/{{ ansible_facts['architecture'] }}-linux-gnu/libaio.so.1"
        state: link
      become: true
      register: libaio_compat_link
      when: is_ubuntu and ansible_facts['distribution_major_version'] | int >= 24

    - name: SQL*Plus | Refresh dynamic linker cache
      ansible.builtin.command:
        cmd: ldconfig
      become: true
      when: libaio_compat_link.changed

    # Oracle serves these without an OTN login; the unversioned filename always
    # resolves to the current Instant Client release.
    - name: SQL*Plus | Download Instant Client Basic package
      ansible.builtin.get_url:
        url: https://download.oracle.com/otn_software/linux/instantclient/instantclient-basic-linuxx64.zip
        dest: /tmp/instantclient-basic-linuxx64.zip
        mode: "0644"

    - name: SQL*Plus | Download Instant Client SQL*Plus package
      ansible.builtin.get_url:
        url: https://download.oracle.com/otn_software/linux/instantclient/instantclient-sqlplus-linuxx64.zip
        dest: /tmp/instantclient-sqlplus-linuxx64.zip
        mode: "0644"

    # Dropped wholesale so a stale instantclient_* directory cannot win the
    # "Find extracted instant client directory" lookup below.
    - name: SQL*Plus | Remove existing instant client installation
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/opt/oracle"
        state: absent

    - name: SQL*Plus | Create installation directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/opt/oracle"
        state: directory

    - name: SQL*Plus | Extract Instant Client Basic
      ansible.builtin.unarchive:
        src: /tmp/instantclient-basic-linuxx64.zip
        dest: "{{ ansible_env.HOME }}/.local/opt/oracle/"
        remote_src: yes

    - name: SQL*Plus | Extract Instant Client SQL*Plus
      ansible.builtin.unarchive:
        src: /tmp/instantclient-sqlplus-linuxx64.zip
        dest: "{{ ansible_env.HOME }}/.local/opt/oracle/"
        remote_src: yes

    - name: SQL*Plus | Find extracted instant client directory
      ansible.builtin.find:
        paths: "{{ ansible_env.HOME }}/.local/opt/oracle"
        patterns: 'instantclient_*'
        file_type: directory
      register: instantclient_dir

    - name: SQL*Plus | Set instant client path
      ansible.builtin.set_fact:
        oracle_home: "{{ instantclient_dir.files[0].path }}"

    - name: SQL*Plus | Create symlink to sqlplus binary
      ansible.builtin.file:
        src: "{{ oracle_home }}/sqlplus"
        dest: "{{ ansible_env.HOME }}/.local/bin/sqlplus"
        state: link
        force: yes

    - name: SQL*Plus | Create symlink to sqlplus64 binary
      ansible.builtin.file:
        src: "{{ oracle_home }}/sqlplus"
        dest: "{{ ansible_env.HOME }}/.local/bin/sqlplus64"
        state: link
        force: yes

    - name: SQL*Plus | Verify installation
      ansible.builtin.command:
        cmd: "{{ ansible_env.HOME }}/.local/bin/sqlplus -version"
      register: sqlplus_version
      environment:
        LD_LIBRARY_PATH: "{{ oracle_home }}"
      changed_when: false
      failed_when: false

    - name: SQL*Plus | Show installed version
      ansible.builtin.debug:
        msg: "Successfully installed: {{ sqlplus_version.stdout }}"
      when: sqlplus_version.rc == 0

    - name: SQL*Plus | Clean up downloaded archives
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/instantclient-basic-linuxx64.zip
        - /tmp/instantclient-sqlplus-linuxx64.zip

    - name: SQL*Plus | Installation complete
      ansible.builtin.debug:
        msg: |

          ================================================================================
          SQL*Plus installation complete!

          To use SQL*Plus, either:
          1. Restart your shell to load the new LD_LIBRARY_PATH, or
          2. Run: source ~/.bashrc

          Then test with: sqlplus -version

          Connect to your database:
          sqlplus system/YourStrongPassword123@localhost:1521/XE
          ================================================================================
