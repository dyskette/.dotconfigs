# zoxide: frecency-ranked `cd` (z, and zi to pick with fzf). yazi's `z` key
# uses it too. The release tarball names carry the version, so the asset is
# looked up through the API, as fd.yml does; its files sit at the archive root.
- name: Retrieve latest zoxide release information from github
  ansible.builtin.uri:
    url: https://api.github.com/repos/ajeetdsouza/zoxide/releases/latest
    method: GET
    return_content: true
  register: zoxide_github_response

- name: Select zoxide download url from json response
  ansible.builtin.set_fact:
    zoxide_download_url: "{{ 0 | extract(zoxide_github_response.json | community.general.json_query(url_query)) }}"
  vars:
    url_query: assets[?ends_with(browser_download_url,'x86_64-unknown-linux-musl.tar.gz')].browser_download_url

- name: Download zoxide tarball
  ansible.builtin.get_url:
    url: "{{ zoxide_download_url }}"
    dest: /tmp/zoxide-x86_64-unknown-linux-musl.tar.gz
    mode: "0644"
  register: download_status

- name: Remove existing zoxide installation
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/zoxide"
    state: absent
  when: download_status.changed # Remove only if the tarball was re-downloaded

- name: Create a new directory for zoxide
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/zoxide"
    state: directory
    mode: "0755"
  when: download_status.changed # Create only if the tarball was re-downloaded

- name: Extract zoxide install files
  ansible.builtin.unarchive:
    src: /tmp/zoxide-x86_64-unknown-linux-musl.tar.gz
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/opt/zoxide"
    remote_src: yes
  when: download_status.changed # Extract only if the tarball was re-downloaded

- name: Create symlink to zoxide binary
  ansible.builtin.file:
    src: "{{ ansible_facts['env']['HOME'] }}/.local/opt/zoxide/zoxide"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/zoxide"
    state: link
    force: yes

- name: Clean up downloaded zoxide tarball
  ansible.builtin.file:
    path: /tmp/zoxide-x86_64-unknown-linux-musl.tar.gz
    state: absent
