- name: Retrieve latest release information from github
  ansible.builtin.uri:
    url: https://api.github.com/repos/dandavison/delta/releases/latest
    method: GET
    return_content: true
  register: delta_github_response

- name: Select download url from json response
  ansible.builtin.set_fact:
    delta_download_url: "{{ 0 | extract(delta_github_response.json | community.general.json_query(url_query)) }}"
  vars:
    url_query: assets[?ends_with(browser_download_url,'x86_64-unknown-linux-gnu.tar.gz')].browser_download_url

- name: Get directory name for content in tarball
  ansible.builtin.set_fact:
    delta_directory: "{{ delta_download_url | regex_search('delta-.+-x86_64-unknown-linux-gnu') }}"

- name: Download delta tarball
  ansible.builtin.get_url:
    url: "{{ delta_download_url }}"
    dest: "/tmp/{{ delta_directory }}.tar.gz"
    mode: "0644"
  register: download_status

- name: Remove existing delta installation
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/opt/delta/"
    state: absent
  when: download_status.changed # Remove only if the tarball was re-downloaded

- name: Extract delta files
  ansible.builtin.unarchive:
    src: "/tmp/{{ delta_directory }}.tar.gz"
    dest: /tmp
    remote_src: yes
  when: download_status.changed # Extract only if the tarball was re-downloaded

- name: Install delta files
  copy:
    src: "/tmp/{{ delta_directory }}/"
    dest: "{{ ansible_env.HOME }}/.local/opt/delta/"
    remote_src: yes
  when: download_status.changed # Create only if the tarball was re-downloaded

- name: Make delta executable
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/opt/delta/delta"
    mode: "0755"

- name: Create symlink to binary
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.local/opt/delta/delta"
    dest: "{{ ansible_env.HOME }}/.local/bin/delta"
    state: link
    force: yes

- name: Clean up downloaded tarball
  ansible.builtin.file:
    path: "/tmp/{{ delta_directory }}.tar.gz"
    state: absent

- name: Clean up downloaded tarball extract
  ansible.builtin.file:
    path: "/tmp/{{ delta_directory }}"
    state: absent
