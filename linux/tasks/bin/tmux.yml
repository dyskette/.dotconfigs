# On ostree hosts (Silverblue) the toolchain is never layered on the host: the build
# runs inside a dedicated toolbx container and installs into the shared $HOME, so the
# host gets the binary without gaining any -devel package. toolbx tracks the host's
# Fedora release, so the result links against the same libevent/ncurses/glibc the host
# ships. `ansible.builtin.package` must not be used on these hosts: Ansible resolves
# pkg_mgr to the deprecated `atomic_container` backend and the task fails with
# "missing required arguments: backend, image".
- name: Tmux | Set build variables
  ansible.builtin.set_fact:
    tmux_build_container: tmux-build
    tmux_build_runner: "{{ 'toolbox run --container tmux-build ' if is_fedora_silverblue else '' }}"
    tmux_build_stamp: "{{ ansible_env.HOME }}/.local/share/tmux/build-commit"

- name: Tmux | Install build dependencies (Debian/Ubuntu)
  ansible.builtin.package:
    name:
      - libevent-dev
      - libncurses-dev
      - build-essential
      - bison
      - pkg-config
      - autotools-dev
      - automake
      - git
    state: present
  become: true
  when: is_ubuntu

- name: Tmux | Install build dependencies (Fedora)
  ansible.builtin.package:
    name:
      - libevent-devel
      - ncurses-devel
      - gcc
      - make
      - bison
      - pkg-config
      - autoconf
      - automake
      - git
    state: present
  become: true
  when: is_fedora

- name: Tmux | Prepare the build container (Fedora Silverblue)
  when: is_fedora_silverblue
  block:
    - name: Tmux | Check for the build toolbx container
      ansible.builtin.command:
        cmd: podman container exists {{ tmux_build_container }}
      register: tmux_build_container_stat
      changed_when: false
      failed_when: false

    - name: Tmux | Create the build toolbx container
      ansible.builtin.command:
        cmd: toolbox create --assumeyes {{ tmux_build_container }}
      when: tmux_build_container_stat.rc != 0

    - name: Tmux | Start the build toolbx container
      ansible.builtin.command:
        cmd: podman start {{ tmux_build_container }}
      changed_when: false

    # toolbx has no passwordless sudo, so the install runs as root over podman exec
    # instead of through `toolbox run`.
    - name: Tmux | Install build dependencies in the build toolbx container
      ansible.builtin.command:
        cmd: >-
          podman exec --user root {{ tmux_build_container }}
          dnf install -y libevent-devel ncurses-devel gcc make bison pkg-config autoconf automake
      register: tmux_build_deps
      changed_when: "'Nothing to do' not in tmux_build_deps.stdout"

- name: Tmux | Check if tmux is already installed and get version
  ansible.builtin.shell: |
    if command -v {{ ansible_env.HOME }}/.local/bin/tmux &> /dev/null; then
      {{ ansible_env.HOME }}/.local/bin/tmux -V
    else
      echo "not installed"
    fi
  register: tmux_current_version
  changed_when: false
  failed_when: false

- name: Tmux | Get latest master branch commit hash
  ansible.builtin.uri:
    url: https://api.github.com/repos/tmux/tmux/commits/master
    method: GET
  register: tmux_latest_commit

- name: Tmux | Read the commit recorded for the installed build
  ansible.builtin.shell: |
    if [ -x {{ ansible_env.HOME }}/.local/bin/tmux ] && [ -r {{ tmux_build_stamp }} ]; then
      cat {{ tmux_build_stamp }}
    else
      echo "not installed"
    fi
  register: tmux_recorded_commit
  changed_when: false
  failed_when: false

- name: Tmux | Set target version
  ansible.builtin.set_fact:
    tmux_target_version: "{{ tmux_latest_commit.json.sha[:7] }}"
    tmux_needs_build: "{{ tmux_recorded_commit.stdout | trim != tmux_latest_commit.json.sha }}"

- name: Tmux | Show current and target versions
  ansible.builtin.debug:
    msg: |
      Current: {{ tmux_current_version.stdout }} ({{ tmux_recorded_commit.stdout | trim }})
      Target: master-{{ tmux_target_version }}
      Build needed: {{ tmux_needs_build }}

- name: Tmux | Build and install from source
  when: tmux_needs_build
  block:
    - name: Tmux | Create build directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/src"
        state: directory

    - name: Tmux | Remove existing source directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/src/tmux"
        state: absent

    - name: Tmux | Clone tmux repository (shallow)
      ansible.builtin.git:
        repo: https://github.com/tmux/tmux.git
        dest: "{{ ansible_env.HOME }}/.local/src/tmux"
        version: master
        depth: 1
        force: true

    # `toolbox run` reuses the caller's working directory, so chdir carries into the
    # container: $HOME is shared with the host and the source tree lives under it.
    - name: Tmux | Generate configure script
      ansible.builtin.command:
        cmd: "{{ tmux_build_runner }}sh autogen.sh"
        chdir: "{{ ansible_env.HOME }}/.local/src/tmux"
      environment:
        PATH: "{{ ansible_env.PATH }}"

    - name: Tmux | Configure build
      ansible.builtin.command:
        cmd: "{{ tmux_build_runner }}./configure --prefix={{ ansible_env.HOME }}/.local"
        chdir: "{{ ansible_env.HOME }}/.local/src/tmux"
      environment:
        PATH: "{{ ansible_env.PATH }}"

    - name: Tmux | Build tmux
      ansible.builtin.command:
        cmd: "{{ tmux_build_runner }}make -j{{ ansible_processor_vcpus }}"
        chdir: "{{ ansible_env.HOME }}/.local/src/tmux"
      environment:
        PATH: "{{ ansible_env.PATH }}"

    - name: Tmux | Install tmux
      ansible.builtin.command:
        cmd: "{{ tmux_build_runner }}make install"
        chdir: "{{ ansible_env.HOME }}/.local/src/tmux"
      environment:
        PATH: "{{ ansible_env.PATH }}"

    - name: Tmux | Verify installation
      ansible.builtin.command:
        cmd: "{{ ansible_env.HOME }}/.local/bin/tmux -V"
      register: tmux_installed_version

    # Written only after the binary has been verified to run, so a failed build
    # never leaves a stamp that would skip the next attempt.
    - name: Tmux | Create the stamp directory
      ansible.builtin.file:
        path: "{{ tmux_build_stamp | dirname }}"
        state: directory
        mode: "0755"

    - name: Tmux | Record the commit that was built
      ansible.builtin.copy:
        content: "{{ tmux_latest_commit.json.sha }}\n"
        dest: "{{ tmux_build_stamp }}"
        mode: "0644"

    - name: Tmux | Show installed version
      ansible.builtin.debug:
        msg: "Successfully installed: {{ tmux_installed_version.stdout }}"

- name: Tmux | Clean up source directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/src/tmux"
    state: absent
  when: tmux_needs_build
