---
# Fedora installation (dnf)
- name: Add HashiCorp repository (Fedora)
  # HashiCorp stopped publishing to the fedora/ path; it now only carries a
  # placeholder "crt-core-helloworld" package, so `dnf install terraform` fails
  # with "No match for argument". The RHEL 9 repo is current and works on
  # Fedora: terraform ships a static Go binary needing only openssl and
  # shadow-utils. releasever is pinned because $releasever expands to the
  # Fedora release (e.g. 42), which has no repo path.
  ansible.builtin.yum_repository:
    name: hashicorp
    description: HashiCorp Stable - $basearch
    baseurl: https://rpm.releases.hashicorp.com/RHEL/9/$basearch/stable
    gpgcheck: true
    gpgkey: https://rpm.releases.hashicorp.com/gpg
    enabled: true
  become: true
  when: is_fedora

- name: Install Terraform (Fedora)
  ansible.builtin.dnf:
    name: terraform
    state: present
  become: true
  when: is_fedora

# Ubuntu installation (apt)
- name: Install prerequisite packages (Ubuntu)
  ansible.builtin.apt:
    name:
      - wget
      - gpg
      - lsb-release
    state: present
    update_cache: true
  become: true
  when: is_ubuntu

- name: Download and install HashiCorp GPG key (Ubuntu)
  ansible.builtin.shell: |
    wget -O - https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg
  when: is_ubuntu

- name: Add HashiCorp repository (Ubuntu)
  ansible.builtin.shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(grep -oP '(?<=UBUNTU_CODENAME=).*' /etc/os-release || lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
  args:
    creates: /etc/apt/sources.list.d/hashicorp.list
  when: is_ubuntu

- name: Install Terraform (Ubuntu)
  ansible.builtin.apt:
    name: terraform
    state: present
    update_cache: true
  become: true
  when: is_ubuntu
