# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
git:
  diffRenderers:
    # lazygit owns scrolling, so delta must not start a pager of its own.
    # lazygit pipes delta's output, so delta can't ask the terminal for its
    # background; lazygit asks instead and hands the answer over as
    # {{colorScheme}}. The colours are the everforest-* features in
    # delta/everforest.gitconfig, shared with glo in both shells.
    - command: delta --paging=never --features=everforest-{{colorScheme}}
os:
  # Plain nvim on every platform, no nvim-remote preset: inside an nvim
  # terminal flatten.nvim hands the file to that nvim (the lazygit float hides
  # meanwhile; commit messages block until written), and outside one it is a
  # normal nvim. The preset's sh syntax would also break under cmd.exe, which
  # lazygit uses on Windows.
  editPreset: nvim

# Back to lazygit as soon as a custom command or editor exits.
promptToReturnFromSubprocess: false

customCommands:
  # Y: the highlighted file in yazi, with its folder around it.
  - key: Y
    context: files
    command: yazi {{.SelectedFile.Name | quote}}
    output: terminal
    description: Open in yazi

gui:
  # JetBrains Mono Nerd Font: file icons, branch and remote glyphs.
  nerdFontsVersion: "3"
  # Same corners as nvim's floats (winborder = single).
  border: single
  # `/` filters lists fuzzily, like fzf.
  filterMode: fuzzy
  # The focused side panel grows; the others shrink to their titles.
  expandFocusedSidePanel: true
  showDivergenceFromBaseBranch: arrowAndNumber
  showNumstatInFilesView: true
  showRandomTip: false
  # <c-d>/<c-u> (and the mouse wheel) scroll the diff by this many lines;
  # the default of 2 makes them feel like line-by-line scrolling.
  scrollHeight: 15
  # The default selection background is ANSI blue, which is a light pastel in
  # Everforest; the line keeps its own aqua/yellow/green text and becomes
  # unreadable. Use bg3, as zellij does for selected rows.
  # Copied (cherry-picked) commits default to blue on cyan, two pastels that
  # are ~1:1 in Everforest; use fg on bg_blue instead. The rebase base commit
  # defaults to blue on yellow, same problem; use fg on bg_yellow.
  darkTheme:
    selectedLineBgColor:
      - "#475258"
    cherryPickedCommitFgColor:
      - "#d3c6aa"
    cherryPickedCommitBgColor:
      - "#3a515d"
    markedBaseCommitFgColor:
      - "#d3c6aa"
    markedBaseCommitBgColor:
      - "#4d4c43"
  lightTheme:
    selectedLineBgColor:
      - "#e6e2cc"
    cherryPickedCommitFgColor:
      - "#5c6a72"
    cherryPickedCommitBgColor:
      - "#e9f0e9"
    markedBaseCommitFgColor:
      - "#5c6a72"
    markedBaseCommitBgColor:
      - "#faedcd"
