# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
#
# Layered over config.yml through LG_CONFIG_FILE (bash/bashrc.d/lazygit.sh),
# where lazygit has a window of its own in every tmux session: `e` and `o`
# hand the file to the session's editor (tmux/scripts/edit.sh) instead of
# starting an nvim inside lazygit, and tmux switches to the nvim window. Run
# from an nvim terminal instead, edit.sh sends the file to that nvim, so the
# lazygit float keeps working as it did.
#
# Windows (psmux) has the same in session-windows.yml: lazygit runs these
# through cmd.exe there, which needs edit.cmd to reach the bash script.
os:
  edit: "~/.dotconfigs/tmux/scripts/edit.sh {{filename}}"
  editAtLine: "~/.dotconfigs/tmux/scripts/edit.sh {{filename}}:{{line}}"
  openDirInEditor: "~/.dotconfigs/tmux/scripts/edit.sh {{dir}}"
  # The file goes to the editor's own window, so lazygit keeps its terminal
  # rather than handing it over and redrawing: a tool that gives the
  # terminal away while another window takes focus gets the terminal's
  # replies typed into that window instead (yazi/yazi.toml says more).
  editInTerminal: false
  # Waits for the editor to exit, which a file sent to another nvim never
  # does: this one stays a plain nvim, in lazygit's own window.
  editAtLineAndWait: "nvim +{{line}} -- {{filename}}"
