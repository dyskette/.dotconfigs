# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
#
# Layered over config.yml on Linux through LG_CONFIG_FILE
# (bash/bashrc.d/lazygit.sh), where lazygit has a window of its own in every
# tmux session: `e` and `o` hand the file to the session's editor
# (tmux/scripts/edit.sh) instead of starting an nvim inside lazygit, and tmux
# switches to the nvim window. Run from an nvim terminal instead, edit.sh
# sends the file to that nvim, so the lazygit float keeps working as it did.
#
# Not on Windows: there lazygit runs these through cmd.exe, which can make
# nothing of a bash script, so config.yml's `editPreset: nvim` stands.
os:
  edit: "~/.dotconfigs/tmux/scripts/edit.sh {{filename}}"
  editAtLine: "~/.dotconfigs/tmux/scripts/edit.sh -l {{line}} {{filename}}"
  openDirInEditor: "~/.dotconfigs/tmux/scripts/edit.sh {{dir}}"
  # The editor takes over the terminal in the one case edit.sh runs nvim
  # itself: a session whose nvim window is not there to be started.
  editInTerminal: true
  # Waits for the editor to exit, which a file sent to another nvim never
  # does: this one stays a plain nvim, in lazygit's own window.
  editAtLineAndWait: "nvim +{{line}} -- {{filename}}"
